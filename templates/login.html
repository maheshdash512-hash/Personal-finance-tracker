{% extends "base.html" %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">◈ FinanceOS</div>
    <div class="auth-sub">Your intelligent money companion</div>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem" onclick="doLogin()">Sign In →</button>
    <div style="margin:1rem 0;text-align:center;color:var(--text3);font-size:0.8rem">
      Demo: username <strong style="color:var(--accent)">demo</strong> / password <strong style="color:var(--accent)">demo123</strong>
    </div>
    <div class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></div>
  </div>
</div>
<script>
async function doLogin() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const r = await fetch('/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const d = await r.json();
  if (d.success) window.location.href = '/dashboard';
  else document.querySelector('.auth-card').insertAdjacentHTML('afterbegin', `<div class="auth-error">${d.error}</div>`);
}
document.getElementById('password')?.addEventListener('keydown', e => e.key==='Enter' && doLogin());
</script>
{% endblock %}
