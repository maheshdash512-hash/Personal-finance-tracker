{% extends "base.html" %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">◈ FinanceOS</div>
    <div class="auth-sub">Create your account</div>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <div class="form-row">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@example.com">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Choose a password">
    </div>
    <div class="form-group">
      <label>Monthly Income (₹)</label>
      <input type="number" id="monthly_income" placeholder="50000">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem" onclick="doRegister()">Create Account →</button>
    <div class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div>
  </div>
</div>
<script>
async function doRegister() {
  const r = await fetch('/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      monthly_income: document.getElementById('monthly_income').value || 0
    })
  });
  const d = await r.json();
  if (d.success) window.location.href = '/dashboard';
  else alert(d.error);
}
</script>
{% endblock %}
